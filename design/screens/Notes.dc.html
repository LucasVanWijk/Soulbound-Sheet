<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/questlog/tokens.css">
<link rel="stylesheet" href="ds/questlog/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7d5411}a:hover{color:#5a3b0a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--q-parch); color: var(--q-ink); font-family: var(--font-body); display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="display: flex; align-items: flex-start; gap: 8px; padding: 18px 10px 4px 22px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<span class="kicker">[Character name]</span>
<h1 class="screen-title" style="margin: 0">Notes</h1>
</div>
<a href="Menu.dc.html" class="btn btn-icon btn-ghost inked" aria-label="Character menu" style="width: 44px; height: 44px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></a>
</div>
<div style="padding: 12px 22px 14px; position: relative">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search notes</label>
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-800)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 34px; top: 26px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input id="q" class="input" placeholder="Search notes" style="min-height: 44px; padding-left: 38px">
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 22px">
<a href="NoteEdit.dc.html" class="panel-framed" style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-decoration: none; color: var(--q-ink)">
<span class="kicker" style="display: flex; align-items: center; gap: 6px"><span class="pin" style="position: static; margin: 0; width: 10px; height: 10px"></span>Pinned</span>
<span class="heading" style="font-size: 19px">Background</span>
<span style="font-size: 14px; line-height: 1.45; color: var(--color-accent-800); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">[Background written during character creation.]</span>
</a>
<div class="panel" style="overflow: hidden">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="4">
<a href="NoteEdit.dc.html" class="row-btn" style="flex-direction: column; align-items: stretch; gap: 3px; padding: 12px 14px; text-decoration: none; border-top: {{n.border}}">
<span style="display: flex; align-items: baseline; gap: 10px"><span class="heading" style="flex: 1; font-size: 17px">{{n.title}}</span><span class="meta tnum">{{n.date}}</span></span>
<span style="font-size: 14px; line-height: 1.45; color: var(--color-accent-800); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{n.body}}</span>
</a>
</sc-for>
</div>
</div>
<a href="NoteEdit.dc.html" class="fab" style="position: absolute; right: 18px; bottom: 96px; z-index: 20; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 20px 0 17px; border-radius: 28px; text-decoration: none; color: var(--color-accent-100); background: radial-gradient(circle at 35% 30%, var(--q-wax-hi), var(--q-wax) 62%); box-shadow: var(--shadow-md); font-family: var(--font-heading); font-weight: 600; font-size: 17px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>New note</a>
<div style="flex: 1"></div>
<nav class="tabbar" aria-label="Sheet sections" style="grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 0">
<a href="Sheet.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 58px; text-decoration: none; color: var(--color-accent-700); font-size: 11px; letter-spacing: .03em">
<span style="width: 22px; height: 2px; margin-bottom: 6px"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 12h-5"></path><path d="M15 8h-5"></path><path d="M19 17V5a2 2 0 0 0-2-2H4"></path><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"></path></svg>
Sheet</a>
<a href="Inventory.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 58px; text-decoration: none; color: var(--color-accent-700); font-size: 11px; letter-spacing: .03em">
<span style="width: 22px; height: 2px; margin-bottom: 6px"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><path d="M8 10h8"></path><path d="M8 18h8"></path><path d="M8 22v-6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path></svg>
Inventory</a>
<a href="Notes.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 58px; text-decoration: none; color: var(--q-ink); font-weight: 600; font-size: 11px; letter-spacing: .03em">
<span style="width: 22px; height: 2px; margin-bottom: 6px; background: var(--q-wax)"></span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"></path><path d="M16 8 2 22"></path><path d="M17.5 15H9"></path></svg>
Notes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const notes = [
      { title: '[Note title]', date: '[date]', body: '[First lines of the note, cut off after two lines so the list stays easy to scan.]' },
      { title: '[Note title]', date: '[date]', body: '[First lines of the note.]' },
      { title: '[Note title]', date: '[date]', body: '[First lines of the note.]' },
      { title: '[Note title]', date: '[date]', body: '[First lines of the note.]' }
    ].map((n, i) => ({ ...n, border: i === 0 ? '0' : '1px solid var(--q-rule)' }));
    return { notes };
  }
}
</script>
</body>
</html>
