<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add XP</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/questlog/tokens.css">
<link rel="stylesheet" href="ds/questlog/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7d5411}a:hover{color:#5a3b0a}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: var(--q-parch); color: var(--q-ink); font-family: var(--font-body); position: relative; overflow: hidden">
<div aria-hidden="true" style="padding: 18px 22px; display: flex; flex-direction: column; gap: 14px">
<span class="kicker">[Archetype] · [Species]</span>
<span class="screen-title">[Character name]</span>
<div style="display: flex; gap: 14px"><div class="panel-framed" style="width: 132px; height: 170px"></div><div style="flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center"><span class="heading tnum" style="font-size: 40px">5 <span class="muted" style="font-size: 22px">/ 12</span></span></div></div>
</div>
<a href="Sheet.dc.html" class="scrim" aria-label="Close" style="display: block"></a>
<div class="sheet" role="dialog" aria-label="Add XP" style="max-height: none">
<div class="sheet-body" style="padding-top: 10px">
<span class="grabber"></span>
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="kicker">Add XP</span>
<span class="title-sheet heading" style="font-size: 26px">Award experience</span>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 18px; padding: 6px 0">
<button class="btn btn-icon btn-secondary" aria-label="Less" onClick="{{dec}}" style="width: 52px; height: 52px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<span class="heading tnum" style="font-size: 56px; line-height: 1; min-width: 80px; text-align: center">{{amount}}</span>
<button class="btn btn-icon btn-secondary" aria-label="More" onClick="{{inc}}" style="width: 52px; height: 52px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
</div>
<div style="display: flex; gap: 8px; justify-content: center">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<button class="chip tnum" aria-pressed="{{q.on}}" onClick="{{q.pick}}" style="min-height: 44px; padding: 0 16px; font-size: 16px">+{{q.n}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 5px">
<label for="why" class="label">Reason (optional)</label>
<input id="why" class="input" placeholder="e.g. Session 4, goal completed" style="min-height: 46px">
</div>
<div class="panel tnum" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px 14px">
<div style="display: flex; flex-direction: column"><span class="label">To spend</span><span class="heading" style="font-size: 19px">5 → {{avail}}</span></div>
<div style="display: flex; flex-direction: column"><span class="label">Earned</span><span class="heading" style="font-size: 19px">12 → {{total}}</span></div>
</div>
<div style="display: flex; gap: 10px">
<a href="Sheet.dc.html" class="btn btn-secondary" style="flex: 1; min-height: 50px; text-decoration: none; color: var(--q-ink)">Cancel</a>
<a href="Sheet.dc.html" class="btn btn-primary inked tnum" style="flex: 2; min-height: 50px; text-decoration: none">Add {{amount}} XP</a>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amount: 3 }; }
  renderVals() {
    const a = this.state.amount;
    const quick = [1, 2, 3, 5].map((n) => ({ n, on: n === a, pick: () => this.setState({ amount: n }) }));
    return {
      amount: a, quick, avail: 5 + a, total: 12 + a,
      dec: () => this.setState({ amount: Math.max(1, a - 1) }),
      inc: () => this.setState({ amount: a + 1 })
    };
  }
}
</script>
</body>
</html>
